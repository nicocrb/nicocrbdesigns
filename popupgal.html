<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Carousel with Comments</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <h2 class="mb-4">Gallery with Comments</h2>
    <div class="row">
        <!-- Carousel (left side) -->
        <div class="col-md-8">
            <div id="galleryCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="images/ArticleDesignStudy.png" alt="Article Design Study" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/CarbonellColorTheoryStudy.jpg" alt="Color Theory Study" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/finalprojectfundamentals.jpg" alt="Analogous Design" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/CreatorOfEpic.png" alt="Social Media Banner"  class="d-block w-100">
                    </div>

                    <div class="carousel-item">
                        <img src="images/jmaasite.png" alt="Japanese Martial Arts Academy - Sapulpa, OK"  class="d-block w-100">
                    </div>

                    <div class="carousel-item">
                     <img src="images/MSAAHNicoCrbDesigns.png" alt="Indie Artist cover" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/SailorMoonIllustration.png" alt="Sailor Moon" class="d-block w-100" >
                    </div>
                    <div class="carousel-item">
                        <img src="images/releaaselightbringer.png" alt="Original Work" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                    <img src="images/rumorsposter.jpg" alt="Rumors Salon - Sand Springs, OK"  class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/Typography.jpg" alt="Typography Study" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/OnePointProductions.jpg" alt="Advertisement One Point Productions - NY, NY" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/NicocrbYT.png" alt="NicoCrb YouTube Banner" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/selfportrait.jpg" alt="Monochromatic Self Portrait" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/kasper.png" alt="Kazper" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                    <img src="images/KasperInTheGripVer2.png" alt="Indie Artist Design"class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/mercurybubbles.png" alt="Sailor Mercury FanArt" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/CarbonellW6A1FINALPRESENTATION.jpg" alt="NicoCrb YouTube Banner" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/NCDESIGNSHELLFIRELEGIOnv2.png" alt="NicoCrb YouTube Banner" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="images/Symptoms.png" alt="Fishing Themed Symptoms Chart" class="d-block w-100">
                    </div>
                    

                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#galleryCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#galleryCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS (with Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
